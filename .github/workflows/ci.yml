name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (host)
        run: go build -trimpath ./cmd/cmdcode2api

      - name: Build (linux/amd64, static)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o cmdcode2api-linux-amd64 ./cmd/cmdcode2api

      - uses: actions/upload-artifact@v4
        with:
          name: cmdcode2api-linux-amd64
          path: cmdcode2api-linux-amd64
          retention-days: 7
